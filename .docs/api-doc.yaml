            closed: { type: integer, example: 5 }
            pendingVerification: { type: integer, description: "Count of submitted, under-review, and documents-verified requests", example: 6 }
        needsReview:
          type: array
          maxItems: 5
          description: Up to five most recent service requests needing staff review, with `owner` and `plan` populated.
          items: { $ref: '#/components/schemas/AdminServiceRequest' }
        period:
          type: object
          properties:
            startDate: { type: string, format: date-time, example: "2026-10-01T00:00:00.000Z" }
            endDate: { type: string, format: date-time, example: "2026-10-26T23:59:59.999Z" }

    AdminUserListItem:
      type: object
      properties:
        _id: { type: string, example: "66f123456789012345678901" }
        name: { type: string, example: "Ada Okafor" }
        email: { type: string, format: email, example: "ada@example.com" }
        createdAt: { type: string, format: date-time, example: "2026-10-01T12:00:00.000Z" }
        planCount: { type: integer, example: 2 }
        totalSaved: { type: integer, description: Minor currency units, example: 1500000 }
        activePlanCount: { type: integer, example: 1 }
        status: { type: string, enum: [Request_Pending, Active_Plan, No_Active_Plan], example: "Active_Plan" }

