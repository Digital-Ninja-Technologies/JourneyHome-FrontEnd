<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Journey Home — Log in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#FBF9F4}
a{color:inherit;text-decoration:none}
input{font-family:'Manrope',system-ui,sans-serif}
</style>
</helmet>
<div style="min-height: 100vh; background: #FBF9F4; color: #0F2420; font-family: 'Manrope', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 36px 24px 80px; box-sizing: border-box">

  <div style="width: 100%; max-width: 1200px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 64px">
    <a href="Home.dc.html" style="display: flex; align-items: center; gap: 10px">
      <svg role="img" aria-label="Journey Home" width="28" height="28" viewBox="0 0 64 64"><path d="M16 56 V30 A16 16 0 0 1 48 30 V56" fill="none" stroke="#0F2420" stroke-width="4.5" stroke-linecap="round"></path><circle cx="32" cy="40" r="6" fill="#D4A55A"></circle><line x1="8" y1="56" x2="56" y2="56" stroke="#0F2420" stroke-width="4.5" stroke-linecap="round"></line></svg>
      <span style="font-size: 19px; font-weight: 800; letter-spacing: -0.4px">Journey Home</span>
    </a>
    <a href="Home.dc.html" style="font-size: 13px; font-weight: 600; color: #5A6660">Back to site</a>
  </div>

  <div style="width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 32px">

    <div style="text-align: center; display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-size: 36px; font-weight: 800; letter-spacing: -1px; line-height: 1.1">Welcome <span style="font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-style: italic; color: #8A6224">back.</span></h1>
      <p style="margin: 0; font-size: 14px; line-height: 1.6; color: #5A6660">Log in to see your plans, payments, and upcoming services.</p>
    </div>

    <section style="background: #FFFFFF; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 2px 10px rgba(15,36,32,0.04)">
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; font-weight: 700; color: #5A6660; text-transform: uppercase; letter-spacing: 1px">Email address</span>
        <input type="email" placeholder="you@example.com" style="height: 48px; border-radius: 12px; border: 1px solid #E2DCCF; padding: 0 14px; font-size: 14px; background: #FBF9F4; color: #0F2420">
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; font-weight: 700; color: #5A6660; text-transform: uppercase; letter-spacing: 1px">Password</span>
        <input type="password" placeholder="Enter your password" style="height: 48px; border-radius: 12px; border: 1px solid #E2DCCF; padding: 0 14px; font-size: 14px; background: #FBF9F4; color: #0F2420">
      </label>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 2px">
        <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #5A6660">
          <input type="checkbox">Remember me
        </label>
        <a href="ForgotPassword.dc.html" style="font-size: 13px; font-weight: 700; color: #8A6224; text-decoration: underline">Forgot password?</a>
      </div>
    </section>

    <a href="Dashboard.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 14px; background: #0F2420; color: #F3EFE7; text-decoration: none; font-size: 14px; font-weight: 700">Log in</a>

    <div style="text-align: center; font-size: 13px; color: #5A6660">New to Journey Home? <a href="OnboardingSignup.dc.html" style="color: #8A6224; font-weight: 700; text-decoration: underline">Create an account</a></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
