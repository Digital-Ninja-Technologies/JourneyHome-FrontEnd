<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Journey Home — Onboarding (First plan)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#FBF9F4}
a{color:inherit;text-decoration:none}
input,select{font-family:'Manrope',system-ui,sans-serif}
</style>
</helmet>
<div style="min-height: 100vh; background: #FBF9F4; color: #0F2420; font-family: 'Manrope', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 36px 24px 80px; box-sizing: border-box">

  <div style="width: 100%; max-width: 1200px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 48px">
    <a href="Home.dc.html" style="display: flex; align-items: center; gap: 10px">
      <svg role="img" aria-label="Journey Home" width="28" height="28" viewBox="0 0 64 64"><path d="M16 56 V30 A16 16 0 0 1 48 30 V56" fill="none" stroke="#0F2420" stroke-width="4.5" stroke-linecap="round"></path><circle cx="32" cy="40" r="6" fill="#D4A55A"></circle><line x1="8" y1="56" x2="56" y2="56" stroke="#0F2420" stroke-width="4.5" stroke-linecap="round"></line></svg>
      <span style="font-size: 19px; font-weight: 800; letter-spacing: -0.4px">Journey Home</span>
    </a>
    <a href="Home.dc.html" style="font-size: 13px; font-weight: 600; color: #5A6660">Exit setup</a>
  </div>

  <div style="width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 36px">

    <!-- STEPPER -->
    <div style="display: flex; align-items: center; justify-content: center; gap: 0">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
        <div style="width: 30px; height: 30px; border-radius: 50%; background: #0F2420; color: #D4A55A; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#D4A55A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></div>
        <span style="font-size: 11px; font-weight: 700; color: #0F2420">Account</span>
      </div>
      <div style="width: 40px; height: 2px; background: #0F2420; margin: 0 2px 20px"></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
        <div style="width: 30px; height: 30px; border-radius: 50%; background: #0F2420; color: #D4A55A; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#D4A55A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></div>
        <span style="font-size: 11px; font-weight: 700; color: #0F2420">Verify</span>
      </div>
      <div style="width: 40px; height: 2px; background: #0F2420; margin: 0 2px 20px"></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
        <div style="width: 30px; height: 30px; border-radius: 50%; background: #0F2420; color: #D4A55A; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800">3</div>
        <span style="font-size: 11px; font-weight: 700; color: #0F2420">First plan</span>
      </div>
      <div style="width: 40px; height: 2px; background: #E2DCCF; margin: 0 2px 20px"></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
        <div style="width: 30px; height: 30px; border-radius: 50%; background: #F0EADC; color: #9A9387; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800">4</div>
        <span style="font-size: 11px; font-weight: 600; color: #9A9387">Payment</span>
      </div>
    </div>

    <div style="text-align: center; display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-size: 36px; font-weight: 800; letter-spacing: -1px; line-height: 1.1">Set up your first <span style="font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-style: italic; color: #8A6224">plan.</span></h1>
      <p style="margin: 0; font-size: 14px; line-height: 1.6; color: #5A6660">Who are you saving for? You can add more plans later, any time.</p>
    </div>

    <section style="background: #FFFFFF; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 2px 10px rgba(15,36,32,0.04)">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px">
        <label style="display: flex; flex-direction: column; gap: 6px; grid-column: 1 / -1">
          <span style="font-size: 12px; font-weight: 700; color: #5A6660; text-transform: uppercase; letter-spacing: 1px">Full name</span>
          <input type="text" placeholder="e.g. Adunni Okafor" style="height: 46px; border-radius: 12px; border: 1px solid #E2DCCF; padding: 0 14px; font-size: 14px; background: #FBF9F4; color: #0F2420">
        </label>
        <label style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 12px; font-weight: 700; color: #5A6660; text-transform: uppercase; letter-spacing: 1px">Relationship</span>
          <select style="height: 46px; border-radius: 12px; border: 1px solid #E2DCCF; padding: 0 14px; font-size: 14px; background: #FBF9F4; color: #0F2420">
            <option>Mother</option><option>Father</option><option>Grandparent</option><option>Uncle / Aunt</option><option>Other</option>
          </select>
        </label>
        <label style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 12px; font-weight: 700; color: #5A6660; text-transform: uppercase; letter-spacing: 1px">State / location</span>
          <input type="text" placeholder="e.g. Lagos" style="height: 46px; border-radius: 12px; border: 1px solid #E2DCCF; padding: 0 14px; font-size: 14px; background: #FBF9F4; color: #0F2420">
        </label>
      </div>

      <div style="height: 1px; background: #EEE9DF"></div>

      <div style="font-size: 13px; font-weight: 700; color: #5A6660; text-transform: uppercase; letter-spacing: 1px">Choose a package</div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px">
        <label style="border: 1.5px solid #E2DCCF; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 6px; cursor: pointer">
          <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 14px; font-weight: 700">Basic</span><input type="radio" name="pkg"></div>
          <div style="font-size: 18px; font-weight: 700; letter-spacing: -0.3px">₦5,000<span style="font-size: 11px; font-weight: 500; color: #5A6660">/mo</span></div>
        </label>
        <label style="border: 1.5px solid #0F2420; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; background: #FBF4E4">
          <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 14px; font-weight: 700">Standard</span><input type="radio" name="pkg" checked></div>
          <div style="font-size: 18px; font-weight: 700; letter-spacing: -0.3px">₦10,000<span style="font-size: 11px; font-weight: 500; color: #5A6660">/mo</span></div>
        </label>
        <label style="border: 1.5px solid #E2DCCF; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 6px; cursor: pointer">
          <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 14px; font-weight: 700">Premium</span><input type="radio" name="pkg"></div>
          <div style="font-size: 18px; font-weight: 700; letter-spacing: -0.3px">₦18,000<span style="font-size: 11px; font-weight: 500; color: #5A6660">/mo</span></div>
        </label>
      </div>
      <a href="Pricing.dc.html" style="font-size: 12px; font-weight: 600; text-decoration: underline">Compare full package details</a>
    </section>

    <div style="display: flex; gap: 12px">
      <a href="OnboardingSignup.dc.html" style="display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 20px; border-radius: 14px; border: 1.5px solid #0F2420; color: #0F2420; text-decoration: none; font-size: 14px; font-weight: 600">Back</a>
      <a href="OnboardingPayment.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 14px; background: #0F2420; color: #F3EFE7; text-decoration: none; font-size: 14px; font-weight: 700">Continue to payment →</a>
    </div>
    <a href="Dashboard.dc.html" style="text-align: center; font-size: 13px; font-weight: 600; color: #5A6660; text-decoration: underline">Skip for now — I'll set up a plan later</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1260}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
