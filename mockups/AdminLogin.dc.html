<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Journey Home — Admin (Log in)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:#15110B}
a{color:inherit;text-decoration:none}
input{font-family:'Manrope',system-ui,sans-serif}
</style>
</helmet>
<div style="min-height: 100vh; background: #15110B; color: #F3EFE7; font-family: 'Manrope', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 60px 24px; box-sizing: border-box">

  <div style="width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 32px">

    <div style="display: flex; flex-direction: column; align-items: center; gap: 14px">
      <div style="display: flex; align-items: center; gap: 10px">
        <svg role="img" aria-label="Journey Home" width="28" height="28" viewBox="0 0 64 64"><path d="M16 56 V30 A16 16 0 0 1 48 30 V56" fill="none" stroke="#F3EFE7" stroke-width="4.5" stroke-linecap="round"></path><circle cx="32" cy="40" r="6" fill="#D4A55A"></circle><line x1="8" y1="56" x2="56" y2="56" stroke="#F3EFE7" stroke-width="4.5" stroke-linecap="round"></line></svg>
        <span style="font-size: 19px; font-weight: 800; letter-spacing: -0.4px">Journey Home</span>
      </div>
      <span style="font-size: 11px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: #D4A55A; border: 1px solid rgba(212,165,90,0.4); border-radius: 999px; padding: 4px 12px">Admin console</span>
    </div>

    <div style="text-align: center; display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.8px; line-height: 1.15">Operations <span style="font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-style: italic; color: #D4A55A">sign in.</span></h1>
      <p style="margin: 0; font-size: 13px; line-height: 1.6; color: #A6A096">Restricted to Journey Home staff. Access is logged.</p>
    </div>

    <section style="background: #1E1A12; border: 1px solid #332C1E; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 16px">
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; font-weight: 700; color: #A6A096; text-transform: uppercase; letter-spacing: 1px">Work email</span>
        <input type="email" placeholder="you@journeyhome.ng" style="height: 46px; border-radius: 12px; border: 1px solid #332C1E; padding: 0 14px; font-size: 14px; background: #15110B; color: #F3EFE7">
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; font-weight: 700; color: #A6A096; text-transform: uppercase; letter-spacing: 1px">Password</span>
        <input type="password" placeholder="Enter your password" style="height: 46px; border-radius: 12px; border: 1px solid #332C1E; padding: 0 14px; font-size: 14px; background: #15110B; color: #F3EFE7">
      </label>
    </section>

    <a href="AdminDashboard.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 50px; border-radius: 14px; background: #D4A55A; color: #15110B; text-decoration: none; font-size: 14px; font-weight: 800">Sign in</a>

    <div style="text-align: center; font-size: 12px; color: #6B655A">Not staff? <a href="Home.dc.html" style="color: #A6A096; text-decoration: underline">Go to the main site</a></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":720}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
