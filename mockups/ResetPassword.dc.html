<div style="min-height: 100vh; background: #FBF9F4; color: #0F2420; font-family: 'Manrope', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 36px 24px 80px; box-sizing: border-box">

  <div style="width: 100%; max-width: 1200px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 64px">
    <a href="Home.dc.html" style="display: flex; align-items: center; gap: 10px">
      <svg role="img" aria-label="Journey Home" width="28" height="28" viewBox="0 0 64 64"><path d="M16 56 V30 A16 16 0 0 1 48 30 V56" fill="none" stroke="#0F2420" stroke-width="4.5" stroke-linecap="round"></path><circle cx="32" cy="40" r="6" fill="#D4A55A"></circle><line x1="8" y1="56" x2="56" y2="56" stroke="#0F2420" stroke-width="4.5" stroke-linecap="round"></line></svg>
      <span style="font-size: 19px; font-weight: 800; letter-spacing: -0.4px">Journey Home</span>
    </a>
    <a href="Home.dc.html" style="font-size: 13px; font-weight: 600; color: #5A6660">Back to site</a>
  </div>

  <div style="width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 32px">

    <div style="background: #E3EFE7; border-radius: 14px; padding: 14px 18px; display: flex; gap: 10px; align-items: flex-start">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F5A40" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px"><path d="M20 6 9 17l-5-5"></path></svg>
      <div style="font-size: 13px; line-height: 1.5; color: #1F5A40">Link verified. You can now set a new password for your account.</div>
    </div>

    <div style="text-align: center; display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-size: 36px; font-weight: 800; letter-spacing: -1px; line-height: 1.1">Set a new <span style="font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-style: italic; color: #8A6224">password.</span></h1>
      <p style="margin: 0; font-size: 14px; line-height: 1.6; color: #5A6660">Choose something you haven't used before.</p>
    </div>

    <section style="background: #FFFFFF; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 2px 10px rgba(15,36,32,0.04)">
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; font-weight: 700; color: #5A6660; text-transform: uppercase; letter-spacing: 1px">New password</span>
        <input type="password" placeholder="At least 8 characters" style="height: 48px; border-radius: 12px; border: 1px solid #E2DCCF; padding: 0 14px; font-size: 14px; background: #FBF9F4; color: #0F2420">
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; font-weight: 700; color: #5A6660; text-transform: uppercase; letter-spacing: 1px">Confirm new password</span>
        <input type="password" placeholder="Re-enter your new password" style="height: 48px; border-radius: 12px; border: 1px solid #E2DCCF; padding: 0 14px; font-size: 14px; background: #FBF9F4; color: #0F2420">
      </label>
    </section>

    <a href="Login.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 14px; background: #0F2420; color: #F3EFE7; text-decoration: none; font-size: 14px; font-weight: 700">Save new password</a>
  </div>
</div>
